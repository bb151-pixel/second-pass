# Render Blueprint: tells Render how to build and run Second Pass.
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: second-pass
    runtime: node
    plan: free # sleeps after ~15 min idle; first visit after that takes ~1 min
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render asks for these two when you create the Blueprint.
      # They are stored privately in Render, never in this repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PRACTICE_ACCESS_CODES
        sync: false
